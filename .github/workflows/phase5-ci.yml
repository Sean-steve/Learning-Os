name: Learning OS — Phase 5 Skill Mastery & Coaching
on:
  push:
    branches: ["phase/5-learning-assessments-mastery-coaching"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mastery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source contracts and all learning, media and mastery unit tests
        run: npm run check:phase1 && npm run check:phase2 && npm run check:phase3 && npm run check:phase4 && npm run check:phase5 && npm run test:core
      - run: npm run typecheck
      - run: npm run build
      - name: Check optional private Bun API TypeScript source
        run: node scripts/check-api-source.mjs
      - run: GITHUB_PAGES=true npm run build && node scripts/check-pages.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-os-phase5-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
