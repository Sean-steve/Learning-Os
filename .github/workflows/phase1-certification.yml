name: Phase 1 UI Certification
on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require imported frontend source
        run: |
          test -f apps/web/src/App.tsx || { echo "::error::Phase 1 source archive must be imported before certification"; exit 1; }
          test -f apps/web/src/styles.css
          test -f services/api/src/server.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Phase 1 structure
        run: npm run check:phase1
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: TypeScript/Bun API health smoke test
        run: |
          bun services/api/src/server.ts > /tmp/learning-os-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3005/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          node -e "const h=require('/tmp/health.json'); if(!h.ok || h.service!=='learning-os-api') process.exit(1)"
          curl -fsS http://127.0.0.1:3005/v1/meta | grep -q "Learning OS"
      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@^1.56.0
          npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npx playwright test
      - name: Upload UI screenshots and debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-os-phase1-ui-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
