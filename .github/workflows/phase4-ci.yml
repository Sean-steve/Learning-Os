name: Learning OS — Phase 4 Scheduling & Calendar
on:
  push:
    branches: ["phase/4-smart-scheduling-google-calendar-accountability"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Structural validation, scheduling and Google payload unit tests
        run: npm run check:phase1 && npm run check:phase2 && npm run check:phase3 && npm run check:phase4 && npm run test:core
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Bun server TypeScript syntax without requiring network installation of Bun
        run: node scripts/check-api-source.mjs
      - run: GITHUB_PAGES=true npm run build && node scripts/check-pages.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/screens.spec.ts tests/e2e/multimedia.spec.ts tests/e2e/phase4.spec.ts
      - name: Save browser screenshots and trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-os-phase4-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
