name: Learning OS — Phase 6 Dependency Lock (one-time)
on:
  push:
    branches: ["phase/6-postgresql-auth-durable-records"]
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'chore: refresh Phase 6 dependency lock')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Commit resolved npm lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh Phase 6 dependency lock"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
